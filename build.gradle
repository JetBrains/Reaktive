buildscript {
    ext.reaktive_version = '2.4.0'
    ext.reaktive_group_id = 'com.badoo.reaktive'
}

plugins {
    id 'binary-compatibility-configuration'
}

allprojects {
    repositories {
        google()
        mavenCentral()

        def kotlinRepoUrl = project.findProperty('kotlin_repo_url')?.toString()
        def kotlinVersion = project.findProperty('kotlin_version')?.toString()
        if (kotlinRepoUrl && kotlinVersion) {
            exclusiveContent {
                forRepository {
                    maven {
                        url = uri(kotlinRepoUrl)
                    }
                }
                filter {
                    includeVersionByRegex('org.jetbrains.kotlin.*', '.*', kotlinVersion)
                }
            }
        }
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && project.hasProperty('kotlin_version')) {
                details.useVersion kotlin_version
                details.because 'multiplatofrm quality gate'
            }
        }
    }
}

subprojects {

    // !! infrastructure for builds as a Kotlin user project
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask).configureEach { kotlinCompilationTask ->
        // ("unconditionally pass the -Xreport-all-warnings CLI option to the Kotlin compiler")
        // ("unconditionally pass the -Xrender-internal-diagnostic-names CLI option to the Kotlin compiler")
        compilerOptions {
            // output reported warnings even in the presence of reported errors
            freeCompilerArgs.add("-Xreport-all-warnings")
            logger.info("<KUP> ${kotlinCompilationTask.path} : added -Xreport-all-warnings")
            // output kotlin.git-searchable names of reported diagnostics
            freeCompilerArgs.add("-Xrender-internal-diagnostic-names")
            logger.info("<KUP> ${kotlinCompilationTask.path} : added -Xrender-internal-diagnostic-names")
        }
    }

// !! infrastructure for builds as a Kotlin user project
// ("implement a Gradle property for passing additional CLI options to the Kotlin compiler")
    def kotlinAdditionalCliOptions = providers.gradleProperty("kotlin_additional_cli_options")
            .map { it.isBlank() ? [] : it.split(" ") } // i sure hope that this level of parsing is in fact enough
            .getOrNull()
    if (kotlinAdditionalCliOptions != null) {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask).configureEach { kotlinCompilationTask ->
            compilerOptions {
                freeCompilerArgs.addAll(kotlinAdditionalCliOptions)
                logger.info("<KUP> ${kotlinCompilationTask.path} : added ${kotlinAdditionalCliOptions.join(" ")}")
            }
        }
    }

// !! infrastructure for builds as a Kotlin user project
// ("unconditionally disable the -Werror compiler CLI option")
    afterEvaluate {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask).configureEach { kotlinCompilationTask ->
            compilerOptions {
                allWarningsAsErrors.set(false)
                freeCompilerArgs.set(
                        freeCompilerArgs.getOrElse([]).findAll { it != "-Werror" }
                )
                logger.info("<KUP> ${kotlinCompilationTask.path} : disabled -Werror")
            }
        }
    }

}