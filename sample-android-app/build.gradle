import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

kotlin {
    compilerOptions{
        if(project.hasProperty('kotlin_language_version')) {
            languageVersion.set(KotlinVersion.fromVersion(kotlin_language_version))
        }
        if(project.hasProperty('kotlin_api_version')) {
            apiVersion.set(KotlinVersion.fromVersion(kotlin_api_version))
        }
    }
}


android {
    namespace "com.badoo.reaktive.sample.android"
    compileSdk 34

    defaultConfig {
        applicationId 'com.badoo.reaktive.sample.android'
        minSdkVersion 15
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintLayout
    implementation project(':reaktive')
    implementation project(':sample-mpp-module')
}
