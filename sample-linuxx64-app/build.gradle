import org.jetbrains.kotlin.gradle.dsl.KotlinVersion
/*
 * Use the following Gradle tasks to run the application:
 * :runReleaseExecutableLinux - release mode
 * :runDebugExecutableLinux - debug mode
 */

plugins {
    id 'kotlin-multiplatform'
}

kotlin {
    linuxX64("linux") {
        binaries {
            executable {
                entryPoint = 'com.badoo.reaktive.sample.linux.main'
                runTask?.args('')
            }
        }
    }

    compilerOptions {
        if (project.hasProperty('kotlin_language_version')) {
            languageVersion.set(KotlinVersion.fromVersion(kotlin_language_version))
        }
        if (project.hasProperty('kotlin_api_version')) {
            apiVersion.set(KotlinVersion.fromVersion(kotlin_api_version))
        }
    }

    sourceSets {
        linuxMain {
            dependencies {
                implementation project(":reaktive")
                implementation project(':sample-mpp-module')
            }
        }
    }
}

tasks.withType(Exec.class).configureEach {
    standardInput = System.in
}
