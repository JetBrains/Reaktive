kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# https://youtrack.jetbrains.com/issue/KT-64851
org.gradle.configuration-cache=false

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with the app's APK
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

kotlin.mpp.applyDefaultHierarchyTemplate=false

# QA QUALITY GATE
#kotlin_repo_url=https://maven.pkg.jetbrains.space/kotlin/p/kotlin/dev
#kotlin_version=2.1.0-dev-853
#kotlin_language_version=2.1
#kotlin_api_version=2.1