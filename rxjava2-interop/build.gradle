import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'publish-configuration'
    id 'detekt-configuration'
}

group = reaktive_group_id
version = reaktive_version

compileKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
        if(project.hasProperty('kotlin_language_version')) {
            languageVersion.set(KotlinVersion.fromVersion(kotlin_language_version))
        }
        if(project.hasProperty('kotlin_api_version')) {
            apiVersion.set(KotlinVersion.fromVersion(kotlin_api_version))
        }
    }
}

compileJava {
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    implementation project(':reaktive')
    implementation libs.rxjava2
}
